esphome:
  min_version: 2025.9.0

esp32:
  framework:
    sdkconfig_options:
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

api:
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
        then:
          - esp32_ble_tracker.stop_scan:

bluetooth_proxy:
  id: bt_proxy
  active: true

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true # Active is migrated to Auto in Home Assistant 2026.6.0+
    continuous: false
    # 20ms gap so a single-core C3 can still service Wi-Fi.
    interval: 320ms
    window: 300ms
