substitutions:
  wifi_configure_action: configure_wifi

# Runtime WiFi management for devices that are provisioned by the user
# (captive portal / Improv) rather than having an SSID compiled in.
#
# To forget WiFi credentials entirely and return to the provisioning AP, use the
# device-level Factory Reset button from diagnostics.yaml. ESPHome has no
# supported way to erase only the saved WiFi credentials.

api:
  actions:
    # Exposed in Home Assistant as esphome.<device>_configure_wifi for advanced
    # users who want to move the device to a new network without re-provisioning.
    - action: ${wifi_configure_action}
      variables:
        ssid: string
        password: string
      then:
        - wifi.configure:
            ssid: !lambda return ssid;
            password: !lambda return password;
            save: true
