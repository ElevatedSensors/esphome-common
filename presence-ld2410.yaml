  presence_ld2410_id: ld2410_hub
  presence_presence_id: ld2410_presence
  presence_moving_target_id: ld2410_moving_target
  presence_still_target_id: ld2410_still_target

ld2410:
  id: ${ld2410_hub_id}
  uart_id: ${ld2410_uart_id}

binary_sensor:
